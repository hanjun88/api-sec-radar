name: "7.0.0-STRICT CI/CD Pipeline Gate"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-gate:
    name: "Frontend: Typecheck & Vitest (16/16)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: Execute SceneManager Vitest Suite
        run: npx vitest run tests/SceneManager.test.ts

  backend-gate:
    name: "Backend: Pytest Suite & AST Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python AST Compilation Check
        run: |
          python3 -m py_compile src/pipeline/*.py
          python3 -m py_compile tests/*.py

      - name: Execute Full Pytest Regression Suite
        run: pytest tests/ -v --durations=10

  container-gate:
    name: "Container: Docker Build & Compose Lint"
    runs-on: ubuntu-latest
    needs: [frontend-gate, backend-gate]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Build Pipeline Image (Python 3.11 Non-Root)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.pipeline
          push: false
          tags: sec-radar/ws-bridge:ci-test

      - name: Build Dashboard Image (Nginx Static)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dashboard
          push: false
          tags: sec-radar/dashboard:ci-test
