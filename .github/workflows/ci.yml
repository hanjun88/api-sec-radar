name: "7.0.0-STRICT CI/CD Pipeline Gate"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-gate:
    name: "Frontend: Typecheck & Vitest (16/16)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck (TS 7 native)
        run: npx tsc --noEmit

      - name: Execute SceneManager Vitest Suite
        run: npx vitest run tests/SceneManager.test.ts

  backend-gate:
    name: "Backend: Ruff Lint, Pytest Suite & AST Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1

      - name: Setup Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.10

      - name: Ruff Lint Gate
        run: ruff check src tests

      - name: Python AST Compilation Check
        run: |
          python3 -m py_compile src/auditor/*.py
          python3 -m py_compile src/pipeline/*.py
          python3 -m py_compile tests/*.py

      - name: Execute Full Pytest Regression Suite
        run: pytest tests/ -v --durations=10

  container-gate:
    name: "Container: Docker Build & Compose Lint"
    runs-on: ubuntu-latest
    needs: [frontend-gate, backend-gate]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Build Pipeline Image (Python 3.14 Non-Root)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile.pipeline
          push: false
          tags: sec-radar/ws-bridge:ci-test

      - name: Build Dashboard Image (Nginx Static)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile.dashboard
          push: false
          tags: sec-radar/dashboard:ci-test

  security-gate:
    name: "Security: Trivy Vulnerability Scan & CycloneDX SBOM"
    runs-on: ubuntu-latest
    needs: [container-gate]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build Local Images for Static Audit
        run: |
          docker build -t sec-radar/ws-bridge:local -f Dockerfile.pipeline .
          docker build -t sec-radar/dashboard:local -f Dockerfile.dashboard .

      - name: Trivy Scan — Pipeline Image (CRITICAL, exit-code 1)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "sec-radar/ws-bridge:local"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Trivy Scan — Dashboard Image (CRITICAL, exit-code 1)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "sec-radar/dashboard:local"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Generate CycloneDX SBOM — Pipeline Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "sec-radar/ws-bridge:local"
          format: "cyclonedx"
          output: "sbom-pipeline.cdx.json"

      - name: Generate CycloneDX SBOM — Dashboard Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "sec-radar/dashboard:local"
          format: "cyclonedx"
          output: "sbom-dashboard.cdx.json"

      - name: Upload SBOM Artifacts (30-day retention)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cyclonedx-sbom-reports
          path: |
            sbom-pipeline.cdx.json
            sbom-dashboard.cdx.json
          retention-days: 30
