networks:
  sec-radar-net:
    driver: bridge

services:
  ws-bridge:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: sec-radar/ws-bridge:latest
    container_name: sec-radar-ws-bridge
    command: ["python3", "src/pipeline/ws_bridge_server.py"]
    ports:
      - "8765:8765"
    networks:
      - sec-radar-net
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('127.0.0.1', 8765)); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: sec-radar/dashboard:latest
    container_name: sec-radar-dashboard
    ports:
      - "3000:3000"
    networks:
      - sec-radar-net
    restart: unless-stopped
    depends_on:
      ws-bridge:
        condition: service_healthy

  live-feeder:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: sec-radar/live-feeder:latest
    container_name: sec-radar-live-feeder
    command: ["python3", "src/pipeline/live_scan_feeder.py"]
    environment:
      - WS_SERVER_URL=ws://ws-bridge:8765
      - SCAN_INTERVAL_SEC=3.0
    networks:
      - sec-radar-net
    restart: unless-stopped
    depends_on:
      ws-bridge:
        condition: service_healthy

  # 全链路自动化工件推流器（profile: pipeline）
  # 摄入(OpenAPI/HAR) → 范围过滤 → 差分扫描 → PoC → 赏金 → 报告落盘 → WS 广播
  artifact-emitter:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: sec-radar/artifact-emitter:latest
    container_name: sec-radar-artifact-emitter
    command:
      - "python3"
      - "src/pipeline/artifact_emitter.py"
      - "--once"
      - "--ws-url"
      - "ws://ws-bridge:8765"
      - "--output-dir"
      - "/tmp/audit_reports"
    environment:
      - WS_SERVER_URL=ws://ws-bridge:8765
      - PRIMARY_TOKEN=Bearer token-alice
      - SECONDARY_TOKEN=Bearer token-bob
    networks:
      - sec-radar-net
    profiles:
      - pipeline
    depends_on:
      ws-bridge:
        condition: service_healthy

  test-feeder:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: sec-radar/test-feeder:latest
    container_name: sec-radar-test-feeder
    command: ["python3", "src/pipeline/test_stream_feeder.py"]
    environment:
      - WS_SERVER_URL=ws://ws-bridge:8765
    networks:
      - sec-radar-net
    profiles:
      - test
    depends_on:
      ws-bridge:
        condition: service_healthy
