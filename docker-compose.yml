version: '3.8'

networks:
  sec-radar-net:
    driver: bridge

services:
  # [新增补丁] 内置极简 HTTP 靶机：所有方法返回 200 + JSON，
  # 让 docker compose up 开箱即看到 200/404 态势推流而非满屏 ERROR。
  # 注意必须用 |（保留换行）而非 >：Python 的 class/def 体不能挤在同一行，否则 SyntaxError。
  mock-target:
    image: python:3.11-slim
    container_name: sec-radar-mock-target
    command: |
      python3 -c "
      import http.server, socketserver
      socketserver.TCPServer.allow_reuse_address = True
      class H(http.server.BaseHTTPRequestHandler):
          def log_message(self, *args): pass
          def do_GET(self):
              self.send_response(200)
              self.send_header('Content-Type', 'application/json')
              self.end_headers()
              self.wfile.write(b'{\"status\": \"mocked\"}')
          do_POST = do_PUT = do_DELETE = do_PATCH = do_GET
      socketserver.TCPServer(('', 18099), H).serve_forever()
      "
    networks:
      - sec-radar-net
    ports:
      - "18099:18099"
    restart: unless-stopped

  ws-bridge:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: sec-radar/ws-bridge:latest
    container_name: sec-radar-ws-bridge
    command: ["python3", "src/pipeline/ws_bridge_server.py"]
    ports:
      - "8765:8765"
    networks:
      - sec-radar-net
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 5s
    # P2-⑨: healthcheck 只属于 ws-bridge（监听 8765 的服务），
    # 不能写在共用镜像层（Dockerfile.pipeline），否则 feeder 容器被误标 unhealthy。
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('127.0.0.1', 8765)); s.close()"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: sec-radar/dashboard:latest
    container_name: sec-radar-dashboard
    ports:
      - "3000:3000"
    networks:
      - sec-radar-net
    restart: unless-stopped
    depends_on:
      ws-bridge:
        condition: service_healthy

  live-feeder:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: sec-radar/live-feeder:latest
    container_name: sec-radar-live-feeder
    command: ["python3", "src/pipeline/live_scan_feeder.py"]
    environment:
      - WS_SERVER_URL=ws://ws-bridge:8765
      - SCAN_INTERVAL_SEC=3.0
      - CONCURRENCY_LIMIT=5
      # [新增补丁] 容器内经同一 network 访问 mock 靶机，开箱即有 200 响应可扫。
      - TARGET_BASE_URL=http://mock-target:18099
    networks:
      - sec-radar-net
    restart: unless-stopped
    # P2-⑨: feeder 不监听端口，显式禁用 healthcheck（防御镜像层残留）。
    healthcheck:
      test: ["NONE"]
    depends_on:
      ws-bridge:
        condition: service_healthy
      mock-target:
        condition: service_started

  test-feeder:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: sec-radar/test-feeder:latest
    container_name: sec-radar-test-feeder
    command: ["python3", "src/pipeline/test_stream_feeder.py"]
    environment:
      - WS_SERVER_URL=ws://ws-bridge:8765
    networks:
      - sec-radar-net
    profiles:
      - test
    # P2-⑨: feeder 不监听端口，显式禁用 healthcheck（防御镜像层残留）。
    healthcheck:
      test: ["NONE"]
    depends_on:
      ws-bridge:
        condition: service_healthy
