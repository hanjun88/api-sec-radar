version: '3.8'

networks:
  sec-radar-net:
    driver: bridge

services:
  ws-bridge:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: sec-radar/ws-bridge:latest
    container_name: sec-radar-ws-bridge
    command: ["python3", "src/pipeline/ws_bridge_server.py"]
    ports:
      - "8765:8765"
    networks:
      - sec-radar-net
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 5s
    # P2-⑨: healthcheck 只属于 ws-bridge（监听 8765 的服务），
    # 不能写在共用镜像层（Dockerfile.pipeline），否则 feeder 容器被误标 unhealthy。
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('127.0.0.1', 8765)); s.close()"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: sec-radar/dashboard:latest
    container_name: sec-radar-dashboard
    ports:
      - "3000:3000"
    networks:
      - sec-radar-net
    restart: unless-stopped
    depends_on:
      ws-bridge:
        condition: service_healthy

  live-feeder:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: sec-radar/live-feeder:latest
    container_name: sec-radar-live-feeder
    command: ["python3", "src/pipeline/live_scan_feeder.py"]
    environment:
      - WS_SERVER_URL=ws://ws-bridge:8765
      - SCAN_INTERVAL_SEC=3.0
      - CONCURRENCY_LIMIT=5
    networks:
      - sec-radar-net
    restart: unless-stopped
    # P2-⑨: feeder 不监听端口，显式禁用 healthcheck（防御镜像层残留）。
    healthcheck:
      test: ["NONE"]
    depends_on:
      ws-bridge:
        condition: service_healthy

  test-feeder:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: sec-radar/test-feeder:latest
    container_name: sec-radar-test-feeder
    command: ["python3", "src/pipeline/test_stream_feeder.py"]
    environment:
      - WS_SERVER_URL=ws://ws-bridge:8765
    networks:
      - sec-radar-net
    profiles:
      - test
    # P2-⑨: feeder 不监听端口，显式禁用 healthcheck（防御镜像层残留）。
    healthcheck:
      test: ["NONE"]
    depends_on:
      ws-bridge:
        condition: service_healthy
